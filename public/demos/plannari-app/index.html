<body>
  <!--
    Portfolio demo note: this app normally talks to a real Laravel backend
    (see lib/api/api_client.dart) for every single interaction — there's no
    "just render the page" fallback. mock-sw.js intercepts those calls and
    answers from seeded in-memory data instead, so the demo needs no server
    at all. The app must not start until that worker is actually controlling
    this page, or its first API calls would race past the mock and fail —
    hence loading flutter_bootstrap.js by hand below instead of the static
    <script> tag Flutter's own build normally puts here.
  -->
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const reg = await navigator.serviceWorker.register('mock-sw.js');
          await navigator.serviceWorker.ready;

          if (!navigator.serviceWorker.controller) {
            // first-ever visit: the worker is active but doesn't control this
            // document yet (that only happens on the *next* navigation) — one
            // silent reload hands it control before Flutter's first API call
            if (!sessionStorage.getItem('plannari-sw-reloaded')) {
              sessionStorage.setItem('plannari-sw-reloaded', '1');
              location.reload();
              return;
            }
          }
        }
      } catch (e) {
        console.warn('mock service worker failed to register — API calls will fail', e);
      }

      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
